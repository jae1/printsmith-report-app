name: Regression tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-regressions:
    name: Offline accounting and release regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regressions without production access
        env:
          PRINTSMITH_LIVE_TESTS: '0'
        run: python -m unittest discover -s tests -v
      - name: Require PowerShell release failure checks
        shell: pwsh
        run: ./tests/test_windows_release.ps1
